<app-layout-rounded-button-footer
  [textoBotao]="textos.botaoContinuar"
  [desabilitarBotao]="formulario().invalid"
  [exibirEspacadorTeclado]="exibirEspacadorTeclado()"
  (botaoClicado)="botaoClicado.emit()"
>
  <app-input
    [controle]="formulario().controls.nome"
    [rotulo]="textos.campos.nome"
    [textoErro]="textos.campoObrigatorio"
  />
  <app-input
    [controle]="formulario().controls.sobrenome"
    [rotulo]="textos.campos.sobrenome"
    [textoErro]="textos.campoObrigatorio"
  />
  <app-input-data
    [controle]="formulario().controls.dataNascimento"
    [rotulo]="textos.campos.dataNascimento"
    [textoErro]="textos.dataInvalida"
  />
  <app-input
    [controle]="formulario().controls.email"
    [rotulo]="textos.campos.email"
    [textoErro]="textos.emailInvalido"
    tipo="email"
    modoTeclado="email"
  />
  <app-input
    [controle]="formulario().controls.telefone"
    [rotulo]="textos.campos.telefone"
    [textoErro]="textos.campoObrigatorio"
    tipo="tel"
    modoTeclado="tel"
  />
  <app-input
    [controle]="formulario().controls.cep"
    [rotulo]="textos.campos.cep"
    [textoErro]="textos.campoObrigatorio"
    modoTeclado="numeric"
  />
  <app-input
    [controle]="formulario().controls.endereco"
    [rotulo]="textos.campos.endereco"
    [textoErro]="textos.campoObrigatorio"
  />
  <app-input
    [controle]="formulario().controls.numero"
    [rotulo]="textos.campos.numero"
    [textoErro]="textos.campoObrigatorio"
    modoTeclado="numeric"
  />
  <app-input
    [controle]="formulario().controls.complemento"
    [rotulo]="textos.campos.complemento"
  />
  <app-input
    [controle]="formulario().controls.bairro"
    [rotulo]="textos.campos.bairro"
    [textoErro]="textos.campoObrigatorio"
  />
  <app-input
    [controle]="formulario().controls.cidade"
    [rotulo]="textos.campos.cidade"
    [textoErro]="textos.campoObrigatorio"
  />
</app-layout-rounded-button-footer>
