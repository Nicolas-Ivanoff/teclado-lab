<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" [text]="textos.voltar" />
    </ion-buttons>
    <ion-title>{{ textos.tituloCapacitor }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="layout-rounded-button-footer">
  <app-formulario-exemplo
    [formulario]="formulario"
    [exibirEspacadorTeclado]="false"
    (botaoClicado)="onBotaoClicado()"
  />
</ion-content>
