<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ textos.titulo }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="layout-rounded-button-footer">
  <div class="home">
    <p class="home__descricao">{{ textos.descricao }}</p>

    <ion-button
      expand="block"
      shape="round"
      class="button-default"
      (click)="abrirFormularioServico()"
    >
      {{ textos.botaoServico }}
    </ion-button>

    <ion-button
      expand="block"
      shape="round"
      class="button-default"
      (click)="abrirFormularioCapacitor()"
    >
      {{ textos.botaoCapacitor }}
    </ion-button>

    <p class="home__info">{{ textos.plataforma }}: {{ plataforma }}</p>
    <p class="home__info">{{ textos.modoAtivo }}: {{ modoAtivo }}</p>
  </div>
</ion-content>
